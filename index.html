<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>القرآن والأذان</title>
<style>
:root{--bg:#fff;--fg:#000;--mute:#666;--line:#d4d4d4}
body.dark{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#2b2b2b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px}
button,select{font:inherit;color:var(--fg);background:none;border:1px solid var(--fg);border-radius:18px;padding:5px 12px;cursor:pointer}
select{background:var(--bg)}
main{flex:1;overflow-y:auto;padding:16px}
.s{display:none}.s.on{display:block}
.next{background:var(--fg);color:var(--bg);border-radius:16px;padding:20px;margin-bottom:14px}
.next .t{font-size:42px;font-weight:700;direction:ltr;text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.row b{direction:ltr}
.tg{width:40px;height:22px;border:1.5px solid var(--fg);border-radius:12px;position:relative;padding:0}
.tg::after{content:"";position:absolute;top:2px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--fg)}
.tg.off{border-color:var(--mute)}.tg.off::after{right:auto;left:3px;background:var(--mute)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar .on{background:var(--fg);color:var(--bg)}
.sr{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.sr .n{width:30px;height:30px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
.sr .nm{flex:1;font-size:20px;font-family:Amiri,"Traditional Arabic",serif;cursor:pointer}
.sr button{font-size:12px;padding:3px 10px}
.q{font-family:Amiri,"Traditional Arabic",serif;font-size:26px;line-height:2.2;text-align:justify}
.q sup{font-size:14px;color:var(--mute);margin:0 4px}
.m{color:var(--mute);font-size:13px;text-align:center;margin:10px 0}
audio{width:100%;margin-top:6px}
.pl{padding:10px 16px;border-top:1px solid var(--line)}
nav{display:flex;border-top:1px solid var(--fg);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;border-radius:0;padding:13px 4px;color:var(--mute)}
nav button.on{color:var(--fg);font-weight:700;box-shadow:inset 0 -3px 0 var(--fg)}
</style>
</head>
<body>
<header><h1 id="ttl">المواقيت</h1><button id="mode">الوضع الليلي</button></header>
<main>
<section class="s on" id="s0">
 <div class="bar"><select id="city"></select><button id="gps">موقعي (GPS)</button><button id="test">تجربة الأذان</button></div>
 <div class="next"><div id="nx">...</div><div class="t" id="nt">--:--</div><div id="cd"></div></div>
 <div id="pt"></div>
 <p class="m" id="pm"></p>
</section>
<section class="s" id="s1"><div id="sl"></div></section>
<section class="s" id="s2"><div class="bar"><button id="back">رجوع للفهرس</button></div><div class="q" id="qt"></div></section>
<section class="s" id="s3">
 <div class="bar" id="rc"></div>
 <div id="al"></div>
</section>
</main>
<div class="pl" id="pl" hidden><div id="pn"></div><audio id="au" controls></audio></div>
<nav><button data-t="0" class="on">المواقيت</button><button data-t="1">المصحف</button><button data-t="3">استماع</button></nav>
<script>
var $=function(s){return document.querySelector(s)},L=localStorage;
function J(k,d){try{var v=JSON.parse(L.getItem(k));return v==null?d:v}catch(e){return d}}
function S(k,v){try{L.setItem(k,JSON.stringify(v))}catch(e){}}
function p2(n){return(n<10?'0':'')+n}
var CITIES={'خريبكة':[32.8811,-6.9063],'الدار البيضاء':[33.5731,-7.5898],'الرباط':[34.0209,-6.8416],'مراكش':[31.6295,-7.9811],'فاس':[34.0331,-5.0003],'طنجة':[35.7595,-5.834],'أكادير':[30.4278,-9.5981],'وجدة':[34.6867,-1.9114],'بني ملال':[32.3373,-6.3498]};
var PR=[['Fajr','الفجر'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];
var st=J('st',{city:'خريبكة',coord:null,on:{Fajr:1,Dhuhr:1,Asr:1,Maghrib:1,Isha:1},rec:'lhd'});
var LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
function coord(){return st.coord||CITIES[st.city]}
// ---------- التنقل والمظهر
var T={0:'المواقيت',1:'المصحف',2:'القراءة',3:'استماع'};
function go(n){
 document.querySelectorAll('.s').forEach(function(s,i){s.classList.toggle('on',i===n)});
 $('#ttl').textContent=T[n];
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',+b.dataset.t===(n===2?1:n))});
 if(n===1)loadIndex();if(n===3)loadAudio();
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(+b.dataset.t)}});
$('#mode').onclick=function(){document.body.classList.toggle('dark');S('dark',document.body.classList.contains('dark'))};
if(J('dark',false))document.body.classList.add('dark');
// ---------- المواقيت (طريقة 21 = المغرب في Aladhan)
function getMonth(y,m){
 var c=coord(),key='tm_'+c[0]+'_'+c[1]+'_'+y+'_'+m,v=J(key,null);
 if(v)return Promise.resolve(v);
 return fetch('https://api.aladhan.com/v1/calendar/'+y+'/'+m+'?latitude='+c[0]+'&longitude='+c[1]+'&method=21').then(function(r){return r.json()}).then(function(j){
  var o={};j.data.forEach(function(d,i){var t={};['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].forEach(function(k){t[k]=d.timings[k].slice(0,5)});o[i+1]=t});
  S(key,o);return o}).catch(function(){return null});
}
function dayT(dt){return getMonth(dt.getFullYear(),dt.getMonth()+1).then(function(m){return m&&m[dt.getDate()]})}
var today=null,nextAt=null;
function renderDay(){
 var now=new Date();
 dayT(now).then(function(t){
  if(!t){$('#pm').textContent='تعذر جلب الأوقات. اتصل بالإنترنت مرة واحدة على الأقل.';return}
  today=t;var h='';
  [['Fajr','الفجر'],['Sunrise','الشروق'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']].forEach(function(p){
   h+='<div class="row"><span>'+p[1]+'</span><b>'+t[p[0]]+'</b>'+(p[0]==='Sunrise'?'<span></span>':'<button class="tg'+(st.on[p[0]]?'':' off')+'" data-k="'+p[0]+'" aria-label="تفعيل"></button>')+'</div>'});
  $('#pt').innerHTML=h;
  $('#pm').textContent='المدينة: '+(st.coord?'موقعي':st.city)+' · طريقة وزارة الأوقاف (حسب Aladhan)';
  document.querySelectorAll('.tg').forEach(function(b){b.onclick=function(){var k=b.dataset.k;st.on[k]=st.on[k]?0:1;S('st',st);renderDay();schedule()}});
  tick();
 });
}
function at(t,add){var a=t.split(':'),d=new Date();d.setDate(d.getDate()+(add||0));d.setHours(+a[0],+a[1],0,0);return d}
function tick(){
 if(!today)return;var now=new Date(),nx=null;
 PR.forEach(function(p){var d=at(today[p[0]]);if(!nx&&d>now)nx={n:p[1],d:d}});
 if(!nx){nx={n:'الفجر (غدا)',d:at(today.Fajr,1)}}
 var s=Math.max(0,Math.round((nx.d-now)/1000));
 $('#nx').textContent='القادمة: '+nx.n;$('#nt').textContent=p2(nx.d.getHours())+':'+p2(nx.d.getMinutes());
 $('#cd').textContent='بعد '+p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60);
 if(!LN){PR.forEach(function(p){var d=at(today[p[0]]),k='f_'+d.toDateString()+p[0];
  if(st.on[p[0]]&&Math.abs(now-d)<30000&&!L.getItem(k)){L.setItem(k,1);adhan()}})}
}
setInterval(tick,1000);
var ad=null;
function adhan(){try{if(!ad)ad=new Audio('adhan.mp3');ad.currentTime=0;ad.play()}catch(e){}}
$('#test').onclick=function(){if(ad&&!ad.paused){ad.pause();this.textContent='تجربة الأذان'}else{adhan();this.textContent='إيقاف'}};
// ---------- الأذان الحقيقي في الخلفية (Capacitor فقط)
function schedule(){
 if(!LN)return;
 var now=new Date(),jobs=[],id=1;
 var days=[0,1,2,3,4,5,6].map(function(i){var d=new Date();d.setDate(d.getDate()+i);return d});
 Promise.all(days.map(dayT)).then(function(ts){
  ts.forEach(function(t,i){if(!t)return;PR.forEach(function(p){
   var d=at(t[p[0]],i);if(st.on[p[0]]&&d>now)jobs.push({id:id++,title:'حان وقت صلاة '+p[1],body:st.coord?'موقعي':st.city,schedule:{at:d,allowWhileIdle:true},channelId:'adhan',sound:'adhan.mp3'})})});
  return LN.requestPermissions().then(function(){
   return LN.createChannel({id:'adhan',name:'الأذان',importance:5,sound:'adhan.mp3',vibration:true,visibility:1})}).then(function(){
   return LN.getPending()}).then(function(p){
   return p.notifications.length?LN.cancel({notifications:p.notifications}):0}).then(function(){
   return jobs.length?LN.schedule({notifications:jobs}):0});
 }).catch(function(e){console.log(e)});
}
// ---------- اختيار المدينة / GPS
Object.keys(CITIES).forEach(function(c){var o=document.createElement('option');o.textContent=c;if(c===st.city&&!st.coord)o.selected=true;$('#city').appendChild(o)});
$('#city').onchange=function(){st.city=this.value;st.coord=null;S('st',st);renderDay();schedule()};
$('#gps').onclick=function(){navigator.geolocation.getCurrentPosition(function(p){st.coord=[+p.coords.latitude.toFixed(4),+p.coords.longitude.toFixed(4)];S('st',st);renderDay();schedule()},function(){alert('تعذر تحديد الموقع')})};
// ---------- المصحف (النص يُجلب مرة واحدة من alquran.cloud ويُحفظ)
var Q=null;
function getQ(){
 if(Q)return Promise.resolve(Q);
 Q=J('quran',null);if(Q)return Promise.resolve(Q);
 return fetch('https://api.alquran.cloud/v1/quran/quran-uthmani').then(function(r){return r.json()}).then(function(j){
  Q=j.data.surahs.map(function(s){return{n:s.number,name:s.name,a:s.ayahs.map(function(a){return a.text})}});S('quran',Q);return Q}).catch(function(){return null});
}
function loadIndex(){
 $('#sl').innerHTML='<p class="m">جاري التحميل...</p>';
 getQ().then(function(q){
  if(!q){$('#sl').innerHTML='<p class="m">اتصل بالإنترنت مرة واحدة لتحميل نص المصحف.</p>';return}
  $('#sl').innerHTML=q.map(function(s){return'<div class="sr" data-n="'+s.n+'"><span class="n">'+s.n+'</span><span class="nm">'+s.name+'</span><span class="m">'+s.a.length+' آية</span></div>'}).join('');
  document.querySelectorAll('#sl .sr').forEach(function(r){r.onclick=function(){read(+r.dataset.n)}});
 });
}
function read(n){
 var s=Q[n-1];go(2);$('#ttl').textContent=s.name;
 $('#qt').innerHTML=s.a.map(function(t,i){return t+'<sup>﴿'+(i+1)+'﴾</sup>'}).join(' ');
 $('#qt').parentNode.scrollTop=0;
}
$('#back').onclick=function(){go(1)};
// ---------- الاستماع (روابط القراء من mp3quran، مع تحميل للاستماع بدون إنترنت)
var RECS={lhd:{name:'محمد اللحيدان',key:'اللحيدان',fb:'https://server8.mp3quran.net/lhdan/'},yas:{name:'ياسر الدوسري',key:'الدوسري',fb:null}};
var servers=J('servers',{lhd:RECS.lhd.fb});
function norm(s){return s.replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا')}
function getServers(){
 if(servers.yas)return Promise.resolve();
 return fetch('https://mp3quran.net/api/v3/reciters?language=ar').then(function(r){return r.json()}).then(function(j){
  j.reciters.forEach(function(r){['lhd','yas'].forEach(function(k){
   if(norm(r.name).indexOf(norm(RECS[k].key))>-1&&r.moshaf&&r.moshaf.length){
    var m=r.moshaf.filter(function(x){return x.surah_total>=114})[0]||r.moshaf[0];if(!servers[k]||k==='yas')servers[k]=m.server}})});
  S('servers',servers)}).catch(function(){});
}
function url(n){return servers[st.rec]+('00'+n).slice(-3)+'.mp3'}
var dls=J('dls',{});
function loadAudio(){
 $('#rc').innerHTML=Object.keys(RECS).map(function(k){return'<button data-k="'+k+'" class="'+(k===st.rec?'on':'')+'">'+RECS[k].name+'</button>'}).join('');
 document.querySelectorAll('#rc button').forEach(function(b){b.onclick=function(){st.rec=b.dataset.k;S('st',st);loadAudio()}});
 getServers().then(function(){return getQ()}).then(function(q){
  if(!servers[st.rec]){$('#al').innerHTML='<p class="m">اتصل بالإنترنت مرة واحدة لجلب رابط هذا القارئ.</p>';return}
  var names=q?q.map(function(s){return s.name}):[];
  var h='';for(var n=1;n<=114;n++){var d=dls[st.rec+n];
   h+='<div class="sr"><span class="n">'+n+'</span><span class="nm" data-p="'+n+'">'+(names[n-1]||'سورة '+n)+'</span><button data-d="'+n+'">'+(d?'محمّلة':'تحميل')+'</button></div>'}
  $('#al').innerHTML=h;
  document.querySelectorAll('[data-p]').forEach(function(e){e.onclick=function(){play(+e.dataset.p,names[e.dataset.p-1])}});
  document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){dl(+b.dataset.d,b)}});
 });
}
function play(n,name){
 $('#pl').hidden=false;$('#pn').textContent=(name||'سورة '+n)+' · '+RECS[st.rec].name;
 var u=url(n),au=$('#au');au.dataset.n=n;
 var go2=function(src){au.src=src;au.play().catch(function(){})};
 if(window.caches&&dls[st.rec+n]){caches.open('aud').then(function(c){return c.match(u)}).then(function(r){return r?r.blob():null}).then(function(b){go2(b?URL.createObjectURL(b):u)}).catch(function(){go2(u)})}
 else go2(u);
}
$('#au').onended=function(){var n=+this.dataset.n;if(n<114)play(n+1)};
function dl(n,b){
 if(dls[st.rec+n]||!window.caches)return;b.textContent='...';
 fetch(url(n)).then(function(r){if(!r.ok)throw 0;return caches.open('aud').then(function(c){return c.put(url(n),r)})}).then(function(){dls[st.rec+n]=1;S('dls',dls);b.textContent='محمّلة'}).catch(function(){b.textContent='تعذر'});
}
renderDay();schedule();
</script>
</body>
</html>
